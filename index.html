<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloodBath 0.5.0 — Descarga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            background-color: #0c0c0e;
            color: #f4f4f5;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Tarjeta principal centrada con esquinas afiladas -->
    <main class="w-full max-w-[440px] bg-[#151518] border border-[#27272c] rounded-[3px] p-6 sm:p-8 shadow-xl">

        <!-- Encabezado -->
        <header class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
                BloodBath <span class="text-[#dc2626]">0.5.0</span>
            </h1>
            <p class="text-sm text-zinc-400 mt-1.5">
                Mod del juego original de <span class="text-zinc-200 font-medium">Felix Filip</span>
            </p>
        </header>

        <!-- Botones de descarga apilados -->
        <div class="space-y-3 mb-6">
            <!-- Botón PC (.ZIP) -->
            <a href="#ENLACE-DESCARGA-PC"
               class="w-full flex items-center justify-between bg-[#dc2626] hover:bg-[#b91c1c] active:bg-[#991b1b] text-white px-4 py-3.5 rounded-[3px] border border-[#ef4444]/40 transition-colors">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5 shrink-0" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 5.3v6.35h7.25V4.3L3 5.3zm0 13.4l7.25 1v-7.35H3v6.35zm8.05 1.1L21 21.2v-8.85h-9.95v7.45zm0-15.6v7.45H21V2.8l-9.95 1.4z"/>
                    </svg>
                    <div class="text-left leading-tight">
                        <div class="text-sm font-bold">Descargar para PC</div>
                        <div class="text-xs text-red-100/85">Windows • .ZIP</div>
                    </div>
                </div>
                <span class="text-xs font-mono bg-black/25 px-2 py-0.5 rounded-[2px]">PC</span>
            </a>

            <!-- Botón Android (.APK) -->
            <a href="#ENLACE-DESCARGA-ANDROID"
               class="w-full flex items-center justify-between bg-[#1d1d22] hover:bg-[#27272e] active:bg-[#18181c] text-white px-4 py-3.5 rounded-[3px] border border-[#32323a] transition-colors">
                <div class="flex items-center gap-3">
                    <svg class="w-5 h-5 text-zinc-300 shrink-0" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M17.523 15.341a.999.999 0 0 1-.999-.999c0-.552.448-.999.999-.999s.999.447.999.999a.999.999 0 0 1-.999.999m-11.046 0a.999.999 0 0 1-.999-.999c0-.552.448-.999.999-.999s.999.447.999.999a.999.999 0 0 1-.999.999m11.404-6.018 1.997-3.459a.416.416 0 0 0-.152-.567.416.416 0 0 0-.568.152L17.136 8.95a12.313 12.313 0 0 0-5.136-1.106c-1.848 0-3.597.404-5.136 1.106L4.842 5.449a.416.416 0 0 0-.568-.152.416.416 0 0 0-.152.567l1.997 3.459C2.688 11.186.343 14.658 0 18.761h24c-.343-4.103-2.688-7.575-6.119-9.438"/>
                    </svg>
                    <div class="text-left leading-tight">
                        <div class="text-sm font-bold">Descargar para Android</div>
                        <div class="text-xs text-zinc-400">Móvil • .APK</div>
                    </div>
                </div>
                <span class="text-xs font-mono text-zinc-300 bg-black/30 px-2 py-0.5 rounded-[2px]">APK</span>
            </a>
        </div>

        <!-- Instrucciones compactas -->
        <div class="border-t border-[#27272c] pt-4 text-xs text-zinc-400 space-y-1.5 leading-relaxed">
            <div class="text-zinc-300 font-semibold uppercase tracking-wider text-[11px]">Instalación</div>
            <p><strong class="text-zinc-200">PC:</strong> Extrae el <code class="text-zinc-300 bg-[#202026] px-1 rounded-[2px]">.ZIP</code> y abre el <code class="text-zinc-300 bg-[#202026] px-1 rounded-[2px]">.exe</code></p>
            <p><strong class="text-zinc-200">Android:</strong> Instala el <code class="text-zinc-300 bg-[#202026] px-1 rounded-[2px]">.APK</code></p>
        </div>

        <!-- Pie minimalista -->
        <footer class="mt-5 pt-4 border-t border-[#27272c] text-center text-[11px] text-zinc-500">
            BloodBath 0.5.0 • Mod por Steamtower
        </footer>

    </main>

</body>
</html>
